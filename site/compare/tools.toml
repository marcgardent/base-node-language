# State of the Art: node graphs as text. One table per tool, in the order of the page.
# site/state-of-the-art-autumn-2026.html is generated from it.
#
# arrows: "Node ⇔ <Format>" both ways, the file is the graph and loads back;
#         "Node ⇒ <Format>" the graph is written out, the file is not read back;
#         "Node ⇐ <Format>" code builds the graph, the graph is not read back as that code.
#         A trailing "(partial)" or "(…)" says what limits it.
# diff, build: "yes", "no" or "partial", with an optional *_note.
# licence: "open source", "free" or "commercial", with licence_note.
# Every fact has a source in `sources`; a cell not checked there says "partial" or is left out.

[page]
title = "State of the Art — Autumn 2026: node graphs as text"
description = "Blender nodes to Python, Geometry Nodes as text, a node graph to JSON: which node editors write their graphs as text and read them back. Blender, NodeToPython, Geometry Script, Nuke .nk, Houdini, Substance, MaterialX, ComfyUI workflow JSON, Unity, Godot, Unreal, TouchDesigner."
published = "2026-11-20"
modified = "2026-11-20"
image = "images/tuple-tiles-nodes.png"

[families.blender]
title = "Blender"
text = """Blender saves node trees inside the binary `.blend` file. Its Python API (`bpy`) can build any tree, \
but Blender has no text form of a tree that it reads back. NodeToPython goes one way: it writes a tree out as a \
Python script that builds it again. Geometry Script goes the other way: you write Python and it builds the tree. \
In both, the Python is not made again from the nodes after you edit them in the editor. Base Node reads and writes \
the same text in both directions."""

[families.compositing]
title = "Compositing and procedural"
text = """Nuke has stored its scripts as text from the start: a `.nk` file is a list of Tcl-style commands, one \
block per node with its knobs. It diffs well and renders from the command line. Houdini's `.hip` is a cpio archive; \
`hexpand` and `hcollapse` unpack and repack it, and `hou.Node.asCode()` prints Python that recreates a node. \
TouchDesigner's `.toe` is binary; `toeexpand` and `toecollapse` turn it into readable files and back."""

[families.materials]
title = "Materials"
text = """Substance Designer's `.sbs` is XML, and Adobe's Automation Toolkit (pysbs) reads and writes it without \
the application. MaterialX is an open standard: its `.mtlx` XML is meant to carry a material graph between \
applications and renderers. Both are full round trips; the XML is long, so a diff is readable but noisy."""

[families.ai]
title = "AI image pipelines"
text = """ComfyUI saves a workflow as JSON and loads it back, with node positions and groups. A second JSON, the \
API format, drops the layout: it is what a script sends to the server to run the graph. Images made with ComfyUI \
carry their workflow, so dropping one on the canvas loads the graph again."""

[families.games]
title = "Game engines"
text = """Unity Shader Graph assets are JSON files, and Godot saves a VisualShader as a text resource (`.tres`): \
both load back and go into git as text, with generated ids in them. Unreal keeps Blueprints in binary `.uasset` \
files and offers a diff tool inside the editor; nodes copied to the clipboard become text that pastes back into a \
graph, but that text is not the saved asset."""

