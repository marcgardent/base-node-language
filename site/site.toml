# The public site: its address and its repository, in this one place, and its pages for site/sitemap.xml.
# The generator of the pages below reads it: the canonical links, Open Graph tags and JSON-LD of
# site/state-of-the-art-autumn-2026.html, site/sitemap.xml and site/robots.txt.

url = "https://basenode.ludopant.com/"
repo = "https://github.com/marcgardent/base-node-language"

# Paths under the site, as served. The tutorials listed are those that use the free modules alone.
# reference/index.html is written when the site is deployed (make docs).
pages = [
  "index.html",
  "developers.html",
  "state-of-the-art-autumn-2026.html",
  "reference/index.html",
  "tutorials/index.html",
  "tutorials/lunar-ground.html",
  "tutorials/mini-moon.html",
]
