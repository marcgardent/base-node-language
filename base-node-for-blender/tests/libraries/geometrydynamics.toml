# Blender's own Geometry Nodes Dynamics Assets, shipped with Blender
# (datafiles/assets/nodes/geometry_nodes_dynamics_assets.blend): read where Blender installed it.
name = "Geometry Nodes Dynamics Assets"
author = "Blender Foundation"
homepage = "https://projects.blender.org/blender/blender-assets"
license = "CC0-1.0"
# Nothing fetched: the file is the one of the Blender running the test. Its sha256 is that of
# Blender 5.3.0's (the version of the CI); another Blender's file fails it until this is bumped.
version = "Blender 5.3.0"
bundled = "assets/nodes/geometry_nodes_dynamics_assets.blend"
sha256 = "a2e6b4013abfc3b9355927e33b2ae5af2182dc079e820041124652a75ce7b100"
trees = ["geometry"]

# Kinds of evaluation not compared, because the original itself does not give twice the same geometry.
[nondeterministic]
# Fed, its Sample UV Surface nodes get Position as "UV Map" and "Sample UV": the ico sphere's "UVs"
# overlap, and which face a sample lands on changes from one evaluation to the next (as "UV Deform" of T3D).
"Sample Surface Transform" = ["mesh caller fed"]

# With Blender 5.2.4 the original "Sample Surface Deformation" does not give twice the same geometry
# either, fed the same way (4 evaluations of 12 differ from the first; none of 12 with Blender 5.3.0):
# its record is geometrydynamics.baseline-5.2.json. A table here replaces the one above.
[blender."5.2".nondeterministic]
"Sample Surface Transform" = ["mesh caller fed"]
"Sample Surface Deformation" = ["mesh caller fed"]
