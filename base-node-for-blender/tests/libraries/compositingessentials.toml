# Blender's own Essentials of the compositor, shipped with Blender
# (datafiles/assets/nodes/compositing_nodes_essentials.blend): read where Blender installed it.
name = "Compositing Nodes Essentials"
author = "Blender Foundation"
homepage = "https://projects.blender.org/blender/blender-assets"
license = "CC0-1.0"
# Nothing fetched: the file is the one of the Blender running the test. Its sha256 is that of
# Blender 5.3.0's (the version of the CI); another Blender's file fails it until this is bumped.
version = "Blender 5.3.0"
bundled = "assets/nodes/compositing_nodes_essentials.blend"
sha256 = "3307ae8ac73d52fdf15b029aea5365086bb30264eb7a8b3508c4d0355cb79f13"
trees = ["compositor"]

# Blender's compositor renders these otherwise once rebuilt, though their text, nodes, settings, links
# and interface are the same: the original's `.Halation 3.021` has three Group Input nodes, the text one.
# Moving, in a copy of the original, the link of `Image Coodinaes` from `Group Input.003` to
# `Group Input.020` (which also holds `Image gamma mapped`) gives the same difference, in the alpha of
# 124 background pixels (1.0 -> 0.845 at worst). Base Node writes a tree's inputs once, whatever the
# number of Group Input nodes; this is the compositor's doing (Blender 5.3.0).
[blender_quirks]
"Film Grain" = ["composite"]
".Noisegroup Internal 3.022" = ["composite"]

# Blender 5.2 LTS ships another file: its own hash, and its own record (compositingessentials.baseline-5.2.json)
[blender."5.2"]
version = "Blender 5.2.4"
sha256 = "2ec397d77d2feec13c738a4b8fdf23f9e7e663c61554986618ec9c44ca6c1cbd"
