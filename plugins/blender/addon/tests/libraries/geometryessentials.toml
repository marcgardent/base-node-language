# Blender's own Geometry Nodes Essentials, shipped with Blender
# (datafiles/assets/nodes/geometry_nodes_essentials.blend): read where Blender installed it.
name = "Geometry Nodes Essentials"
author = "Blender Foundation"
homepage = "https://projects.blender.org/blender/blender-assets"
license = "CC0-1.0"
# Nothing fetched: the file is the one of the Blender running the test. Its sha256 is that of
# Blender 5.3.0's (the version of the CI); another Blender's file fails it until this is bumped.
version = "Blender 5.3.0"
bundled = "assets/nodes/geometry_nodes_essentials.blend"
sha256 = "4271f315f5703d26ab412888a4212303ce3fb667b87c48538c1c0960e391611c"
trees = ["geometry"]

# Blender 5.2 LTS ships another file: its own hash, and its own record (geometryessentials.baseline-5.2.json)
[blender."5.2"]
version = "Blender 5.2.4"
sha256 = "4592ec2a51b1adbd87467812979ddebb09f6606a49aa75549fdd2b40b7ffac86"
