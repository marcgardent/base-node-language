schema_version = "1.0.0"

id = "base_node"
version = "1.0.0-rc.7"
name = "Base Node"
tagline = "Nodes as text (.bn): read and write node trees as functions"
maintainer = "Marc Gardent"
type = "add-on"
website = "https://basenode.ludopant.com/"
tags = ["Node", "Geometry Nodes", "Material", "Compositing", "Text Editor", "Import-Export"]

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = [
  "2026 Marc Gardent",
  # host/sugiyama.py and host/sockets.py follow Node Arrange (GPL-2.0-or-later)
  "2024 Leonardo Pike-Excell (Node Arrange)",
]

[permissions]
files = "Import .bn files and the modules they use from disk"
clipboard = "Copy node trees as .bn text and paste .bn text as nodes"

[build]
paths_exclude_pattern = [
  "tests/",
  "__pycache__/",
  "*.pyc",
  "listing.md",
  "listing/",
  "build.sh",
  "/blender/_targets/backends/",
]
