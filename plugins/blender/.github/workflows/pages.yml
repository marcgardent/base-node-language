# The Pages of Base Node for Blender once this folder is its own repository (the core a git submodule
# at core/), served at https://basenode.ludopant.com/. Not run here: the root's pages.yml deploys
# plugins/blender/site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (the version web/Cargo.toml pins)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build bn-view (site/view/pkg)
        run: ./web/build.sh
      - name: Write the reference pages (site/reference, the language's from core/spec/)
        run: make docs CORE=core
      - name: Prepare site
        run: touch site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
