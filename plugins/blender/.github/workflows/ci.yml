# The CI of Base Node for Blender once this folder is its own repository, the core of the language a
# git submodule at core/ (see "Where the core is" in README.md). Not run here: GitHub runs the
# workflows of the repository's root, whose ci.yml has the same jobs on plugins/blender.
name: CI

on:
  # Actions minutes cost: the CI runs on a version tag (make release) or by hand (make ci), not on
  # every push or pull request. Run the tests on the machine first (make test).
  push:
    tags: ["v*"]
  workflow_dispatch:

# A new run on the same ref stops the one before: only the last is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository: the token they get can do nothing else.
# Actions are pinned by commit, so that a tag moved upstream changes nothing here.
permissions:
  contents: read

jobs:
  blender-python:
    name: Blender library, Python (pytest)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout runs `git init`: with a default branch name set, git gives no hint about it
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pytest and build
        run: pip install pytest build
      - name: Build the wheels and run base-node with the Blender library installed (its entry point)
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" core/python
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" python
          unzip -Z1 "$RUNNER_TEMP"/dist/base_node_blender-*.whl | grep -qx base_node_blender/_targets/blender/gltf.json
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/venv/bin/base-node" check examples/ripples.bn
      - name: Run the Python tests
        run: make test-python CORE=core
      - name: Run add-on module security tests (no Blender)
        run: python3 addon/tests/test_modules.py
      - name: Check the regression badges against the baselines (no Blender)
        run: python3 addon/tests/regression_badges.py --check
      - name: Check the versions of the Blender library, and the core it needs
        run: make bump-check CORE=core

  blender-rust:
    name: Blender library and bn-view, Rust & WASM32
    runs-on: ubuntu-latest
    steps:
      # actions/checkout runs `git init`: with a default branch name set, git gives no hint about it
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: "Run the Rust tests of the Blender library (stdlib, targets, head of a file, corpus)"
        run: make test-rust CORE=core
      - name: Check wasm32-unknown-unknown target (the Blender library)
        working-directory: rust
        run: cargo check --target wasm32-unknown-unknown
      - name: Run the tests of bn-view
        run: make test-web CORE=core
      - name: Build the bn-view wasm
        working-directory: web
        run: cargo build --release --target wasm32-unknown-unknown

  blender:
    name: Blender ${{ matrix.blender }} Extension & Third-Party Libraries
    runs-on: ubuntu-latest
    # The versions of Blender promised (`promised` in targets/blender.json): the LTS and the latest.
    # One does not stop the other: each says what it finds.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Of blender-5.2.4-linux-x64.tar.xz, from download.blender.org/release/Blender5.2/blender-5.2.4.sha256
          - blender: "5.2.4"
            sha256: 2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          # Of blender-5.3.0-linux-x64.tar.xz, from download.blender.org/release/Blender5.3/blender-5.3.0.sha256
          - blender: "5.3.0"
            sha256: dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
      BLENDER_SHA256: ${{ matrix.sha256 }}
    steps:
      # actions/checkout runs `git init`: with a default branch name set, git gives no hint about it
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check --strict
          tar -xJ -C ~/blender --strip-components=1 -f "$RUNNER_TEMP/blender.tar.xz"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Cache third-party libraries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/base-node/libraries
          # Per Blender: the groups an add-on's Python builds are made by the Blender that runs
          key: libraries-${{ matrix.blender }}-${{ hashFiles('addon/tests/libraries/*.toml') }}
      - name: Build the extension .zip (the core linked into addon/lang/, the links resolved into files)
        run: |
          make extension CORE=core BLENDER="$HOME/blender/blender" DIST="$RUNNER_TEMP/dist"
          files=$(unzip -Z1 "$RUNNER_TEMP"/dist/base_node-*.zip)
          for f in lang/parser.py blender/targets.py blender/_targets/blender.json blender/_targets/blender/gltf.json stdlib/manifest.json stdlib/math.bn; do
            echo "$files" | grep -qx "$f" || { echo "the .zip lacks $f"; exit 1; }
          done
      # The runner has no GPU: OpenGL (Mesa's software one) at once, rather than Vulkan tried and failed first
      - name: Run extension tests
        run: >-
          ~/blender/blender --background --factory-startup --gpu-backend opengl --python-exit-code 1
          --python addon/tests/test_extension.py
      - name: Check the backend the reference reads (nodes, stdlib per kind of tree)
        if: success() || failure()
        run: >-
          ~/blender/blender --background --factory-startup --gpu-backend opengl --python-exit-code 1
          --python addon/tests/export_backend.py -- --check
      # The third-party libraries take the longest: on main and on demand, not on every pull request
      # (`make test-libraries` runs them at home before a change to the reader or the builder).
      - name: Run third-party libraries non-regression
        if: (success() || failure()) && github.event_name != 'pull_request'
        run: >-
          ~/blender/blender --background --factory-startup --gpu-backend opengl --python-exit-code 1
          --python addon/tests/test_libraries.py
