# The crates of Base Node for Blender: its library (rust/) and the web component (web/). The core of
# the language is their one dependency outside this folder, named here alone: its path, the checkout
# CORE of the Makefile, and the version this folder needs.
[workspace]
members = ["rust", "web"]
resolver = "2"

[workspace.dependencies]
base-node = { path = "../../rust", version = "=1.0.0-rc.7" }

[profile.release]
opt-level = "s"
lto = true
