[package]
name = "base-node-blade"
version = "1.0.0-rc.7"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Blade's Pixel Nodes for Base Node (.bn): the target blade, its translator from blender, its bridge, made known to base-node-blender (wasm32 compatible)"
publish = false

# The core of the language and Blender's library, which reads the target and translates to it
[dependencies]
base-node = { path = "../../../rust", version = "=1.0.0-rc.7" }
base-node-blender = { path = "../../blender/rust", version = "=1.0.0-rc.7" }
