name: CI

on:
  # Actions minutes cost: the CI runs on a version tag (make release) or by hand (make ci), not on
  # every push or pull request. Run the tests on the machine first (make test).
  push:
    tags: ["v*"]
  workflow_dispatch:

# A new run on the same ref stops the one before: only the last is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository: the token they get can do nothing else.
# Actions are pinned by commit, so that a tag moved upstream changes nothing here.
permissions:
  contents: read

jobs:
  core:
    name: Core (Python, Rust, WASM32)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout runs `git init`: with a default branch name set, git gives no hint about it
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Install pytest and build
        run: pip install pytest build
      - name: Build the wheel (base_node and base_node_cli, nothing else)
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" python
          files=$(unzip -Z1 "$RUNNER_TEMP"/dist/base_node-*.whl)
          echo "$files" | grep -qx base_node/parser.py
          echo "$files" | grep -qx base_node_cli/cli.py
          ! echo "$files" | grep -Ev '^(base_node/|base_node_cli/|base_node-[^/]*\.dist-info/)'
      - name: "Run the Python tests (parser, formatter, conformance, no destination named)"
        run: make test-python
      - name: "Run the Rust tests (format, clippy, conformance, fixtures, limits, no destination named)"
        run: make test-rust
      - name: Check wasm32-unknown-unknown target
        run: make wasm
      - name: Check the versions of the core
        run: make bump-check
