name: CI

on:
  # Actions minutes cost: the CI runs on a version tag (make release) or by hand (make ci), not on
  # every push or pull request. Run the tests on the machine first (make test).
  push:
    tags: ["v*"]
  workflow_dispatch:

# A new run on the same ref stops the one before: only the last is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository: the token they get can do nothing else.
# Actions are pinned by commit, so that a tag moved upstream changes nothing here.
permissions:
  contents: read

jobs:
  python:
    name: Python Parser & Targets (pytest)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout runs `git init`: with a default branch name set, git gives no hint about it
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Build the wheel (base_node/_targets, a link to targets/, as files)
        run: |
          pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" python
          unzip -Z1 "$RUNNER_TEMP"/dist/base_node-*.whl | grep -qx base_node/_targets/gltf.json
      - name: Run Python test suite & conformance
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: pytest -v python/tests
      - name: Run add-on module security tests (no Blender)
        run: python3 base-node-for-blender/tests/test_modules.py
      - name: Check the regression badges against the baselines (no Blender)
        run: python3 base-node-for-blender/tests/regression_badges.py --check

  rust:
    name: Rust Parser, Formatter & WASM32
    runs-on: ubuntu-latest
    steps:
      # actions/checkout runs `git init`: with a default branch name set, git gives no hint about it
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Run cargo test (stdlib, conformance, fixtures, targets)
        working-directory: rust
        run: cargo test
      - name: Run cargo clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Check wasm32-unknown-unknown target
        working-directory: rust
        run: cargo check --target wasm32-unknown-unknown
      - name: Run cargo test (bn-view web component)
        working-directory: web
        run: cargo test
      - name: Run cargo clippy (bn-view web component)
        working-directory: web
        run: cargo clippy --all-targets -- -D warnings
      - name: Build the bn-view wasm
        working-directory: web
        run: cargo build --release --target wasm32-unknown-unknown

  blender:
    name: Blender Extension & Third-Party Libraries
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "5.3.0"
      # Of blender-5.3.0-linux-x64.tar.xz, from download.blender.org/release/Blender5.3/blender-5.3.0.sha256
      BLENDER_SHA256: dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05
    steps:
      # actions/checkout runs `git init`: with a default branch name set, git gives no hint about it
      - name: Set git's default branch name
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check --strict
          tar -xJ -C ~/blender --strip-components=1 -f "$RUNNER_TEMP/blender.tar.xz"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Cache third-party libraries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/base-node/libraries
          key: libraries-${{ hashFiles('base-node-for-blender/tests/libraries/*.toml') }}
      - name: Build the extension .zip (its links resolved into files)
        run: |
          BLENDER=~/blender/blender base-node-for-blender/build.sh "$RUNNER_TEMP/dist"
          files=$(unzip -Z1 "$RUNNER_TEMP"/dist/base_node-*.zip)
          for f in lang/targets.py lang/_targets/gltf.json stdlib/manifest.json stdlib/math.bn; do
            echo "$files" | grep -qx "$f" || { echo "the .zip lacks $f"; exit 1; }
          done
      # The runner has no GPU: OpenGL (Mesa's software one) at once, rather than Vulkan tried and failed first
      - name: Run extension tests
        run: >-
          ~/blender/blender --background --factory-startup --gpu-backend opengl --python-exit-code 1
          --python base-node-for-blender/tests/test_extension.py
      - name: Check the backend the reference reads (nodes, stdlib per kind of tree)
        if: success() || failure()
        run: >-
          ~/blender/blender --background --factory-startup --gpu-backend opengl --python-exit-code 1
          --python base-node-for-blender/tests/export_backend.py -- --check
      # The third-party libraries take the longest: on main and on demand, not on every pull request
      # (`make test-libraries` runs them at home before a change to the reader or the builder).
      - name: Run third-party libraries non-regression
        if: (success() || failure()) && github.event_name != 'pull_request'
        run: >-
          ~/blender/blender --background --factory-startup --gpu-backend opengl --python-exit-code 1
          --python base-node-for-blender/tests/test_libraries.py
