[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-node"
version = "0.13.0"
description = "Base Node (.bn) parser, formatter, and target checker"
readme = "README.md"
authors = [{ name = "Marc Gardent" }]
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.scripts]
base-node = "base_node.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["base_node*"]

[tool.setuptools.package-data]
base_node = [
  "py.typed", "_targets/*.json", "_targets/*/*.bn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
