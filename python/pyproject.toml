[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-node"
version = "1.0.0rc7"
description = "Base Node (.bn) parser and formatter: the core of the language, and its command line"
readme = "README.md"
authors = [{ name = "Marc Gardent" }]
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.scripts]
base-node = "base_node_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["base_node", "base_node_cli"]

# base_node is the core of the language, base_node_cli the command line: a host library adds its
# commands to it by an entry point of the group base_node.cli
[tool.setuptools.package-data]
base_node = ["py.typed"]
base_node_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
